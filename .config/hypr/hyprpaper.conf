# Hyprpaper configuration
# Wallpaper settings for Hyprland

# Preload wallpapers for better performance when switching
preload = ~/.config/hypr/theme/walls/city.png
preload = ~/.config/hypr/theme/walls/arch-logo.png
preload = ~/.config/hypr/theme/walls/hyprland-logo.png
preload = ~/.config/hypr/theme/walls/anime-skull.png
preload = ~/.config/hypr/theme/walls/abstract-swirls.jpg
preload = ~/.config/hypr/theme/walls/hyprland-logo.png

# Set initial wallpaper
wallpaper = eDP-1,~/.config/hypr/theme/walls/city.png

# For multiple monitors (uncomment and modify as needed):
# wallpaper = HDMI-A-1,~/.config/hypr/theme/walls/arch-logo.png

# Disable splash screen
splash = false