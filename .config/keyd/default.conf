# Keyd Configuration for keyboard remapping
# This provides similar functionality to kanata:
# - Caps Lock acts as Escape when tapped, Control when held
# - HJKL act as arrow keys when Control is held

[ids]
# Apply to all keyboards
*

[main]
# Maps capslock to escape when tapped, control when held
esc = capslock
capslock = overload(layer, esc)

# Remaps hjkl to arrow keys when control is held
[layer]
h = left
j = down
k = up
l = right

# Optional: Additional useful mappings
# alt+tab = A-tab
