<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adams Shoe Customization</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Customize Your Adams Shoe</h1>
        </header>

        <main>
            <div class="customization-area">
                <div class="shoe-preview">
                    <div class="shoe" id="shoePreview">
                        <!-- Shoe SVG will be placed here -->
                        <svg width="300" height="200" viewBox="0 0 300 200">
                            <path id="shoeBase" d="M50,150 Q100,50 200,50 Q250,75 250,125 L250,150 L50,150 Z"
                                fill="#333" />
                            <path id="shoeUpper" d="M80,10 Q100,60 150,60 Q200,60 220,100 L220,130 L80,130 Z"
                                fill="#666" />
                            <circle cx="120" cy="115" r="8" fill="#fff" />
                            <circle cx="180" cy="115" r="8" fill="#fff" />
                        </svg>
                    </div>

                    <div class="customization-options">
                        <div class="option-group">
                            <label for="colorPicker">Shoe Color:</label>
                            <input type="color" id="colorPicker" value="#333333">
                        </div>

                        <div class="option-group">
                            <label for="upperColorPicker">Upper Color:</label>
                            <input type="color" id="upperColorPicker" value="#666666">
                        </div>

                        <div class="option-group">
                            <label for="soleColorPicker">Sole Color:</label>
                            <input type="color" id="soleColorPicker" value="#00000">
                        </div>

                        <div class="option-group">
                            <label for="shoeStyle">Shoe Style:</label>
                            <select id="shoeStyle">
                                <option value="sneaker">Sneaker</option>
                                <option value="loafer">Loafer</option>
                                <option value="boot">Boot</option>
                                <option value="sandals">Sandals</option>
                            </select>
                        </div>

                        <div class="option-group">
                            <label for="sizeSelector">Size:</label>
                            <select id="sizeSelector">
                                <option value="7">US 7</option>
                                <option value="8">US 8</option>
                                <option value="9">US 9</option>
                                <option value="10">US 10</option>
                                <option value="11">US 11</option>
                                <option value="12">US 12</option>
                            </select>
                        </div>

                        <button id="resetBtn" class="btn">Reset Customization</button>
                        <button id="saveBtn" class="btn primary">Save Design</button>
                    </div>
                </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
